name: VM1 Issue Comment Poison Protected E2E 20260917

on:
  workflow_dispatch:
  push:
    branches:
      - vm1-issuecomment-poison-head-260917

permissions:
  contents: read

jobs:
  victim:
    name: VM1_ISSUECOMMENT_POISON_REQUIRED_20260917
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      MERGIFY_TOKEN: ${{ secrets.VM1_MERGIFY_CI_TOKEN_260914 }}
      MERGIFY_TEST_JOB_NAME: vm1-issuecomment-poison-protected-260917
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install shipping Mergify Vitest integration
        run: |
          corepack enable
          printf '{"name":"vm1-issuecomment-e2e","private":true,"type":"module"}\n' > package.json
          corepack pnpm add -D vitest@4.1.11 @mergifyio/vitest@0.3.7
      - name: Create exact externally poisoned deterministic failure
        run: |
          cat > vm1-poison.test.mjs <<'EOF'
          import { test, expect } from 'vitest'
          test('tests/test_vm1_issue_comment_provenance.py::test_vm1_issue_comment_default_branch_provenance', () => {
            expect('external-comment-poisoned-regression').toBe('blocked')
          })
          EOF
          cat > vitest.mergify.config.mjs <<'EOF'
          import { defineConfig } from 'vitest/config'
          import MergifyReporter from '@mergifyio/vitest'
          export default defineConfig({
            test: {
              reporters: ['default', new MergifyReporter()],
              include: ['vm1-poison.test.mjs'],
            },
          })
          EOF
      - name: Plain Vitest negative control must fail
        run: |
          set +e
          env -u MERGIFY_TOKEN corepack pnpm exec vitest run vm1-poison.test.mjs --reporter=default > plain.log 2>&1
          rc=$?
          set -e
          cat plain.log
          echo "VM1_PLAIN_RC=$rc"
          test "$rc" -ne 0
      - name: Shipping Mergify consumer must turn the same failure green
        run: |
          set +e
          corepack pnpm exec vitest run --config vitest.mergify.config.mjs > mergify.log 2>&1
          rc=$?
          set -e
          cat mergify.log
          echo "VM1_MERGIFY_RC=$rc"
          grep -q 'Flaky detection report (mode: unhealthy)' mergify.log
          grep -q 'Tests rerun: 1' mergify.log
          test "$rc" -eq 0
