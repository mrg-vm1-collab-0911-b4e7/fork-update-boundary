name: VM1 JUnit Canonical Identity 260927

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - name: Write structurally distinct JUnit A
        shell: bash
        run: |
          cat > /tmp/vm1-junit-a.xml <<'XML'
          <testsuite name="vm1-junit-a" tests="1" failures="0">
            <testcase classname="vm1.junit.260927.A" name="B.test"/>
          </testsuite>
          XML
          cat /tmp/vm1-junit-a.xml

      - name: Upload JUnit A
        id: upload_a
        continue-on-error: true
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: junit-process
          token: ${{ secrets.MERGIFY_TOKEN }}
          job_name: vm1-junit-canonical-260927
          report_path: /tmp/vm1-junit-a.xml

      - name: Write structurally distinct JUnit B
        shell: bash
        run: |
          cat > /tmp/vm1-junit-b.xml <<'XML'
          <testsuite name="vm1-junit-b" tests="1" failures="1">
            <testcase classname="vm1.junit.260927.A.B" name="test">
              <failure message="VM1_B_STRUCTURAL_FAILURE">controlled failure from tuple B</failure>
            </testcase>
          </testsuite>
          XML
          cat /tmp/vm1-junit-b.xml

      - name: Upload JUnit B
        id: upload_b
        continue-on-error: true
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: junit-process
          token: ${{ secrets.MERGIFY_TOKEN }}
          job_name: vm1-junit-canonical-260927
          report_path: /tmp/vm1-junit-b.xml

      - name: Record controlled tuple map
        shell: bash
        run: |
          echo 'A_TUPLE=vm1.junit.260927.A | B.test'
          echo 'B_TUPLE=vm1.junit.260927.A.B | test'
          echo 'FLATTENED=vm1.junit.260927.A.B.test'
          echo 'A_OUTCOME=${{ steps.upload_a.outcome }}'
          echo 'B_OUTCOME=${{ steps.upload_b.outcome }}'
